name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows also runs the tests on .NET Framework 4.8, against the netstandard2.0 build
        # that Revit, Rhino 7 and other .NET Framework hosts load.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/Mnml.Sdk -c Release --no-build -o artifacts
        if: matrix.os == 'ubuntu-latest'
